# Fly.io: the Rolepay MAINNET app, https://app.rolepay.app. PREPARED, NOT CREATED: real money.
# The steps are the demo's (apps/server/README.md, "Deploying") with this file, after:
#   - its own Discord application (never the demo's) and its own ROLEPAY_MASTER_KEY, as secrets;
#   - ROLEPAY_PAYOUT_TOKEN below (config refuses mainnet without it) and, for fee_budget mode,
#     ROLEPAY_FEE_TOKEN (mainnet has no sponsor configured);
#   - the mainnet prerequisites in docs/ARCHITECTURE.md (the setup page served from a separate
#     static origin the bot server cannot change).
#
#   fly apps create rolepay-app
#   fly volumes create rolepay_app_data --app rolepay-app --region cdg --size 1
#   fly deploy -c fly.app.toml --ha=false
#   fly certs add app.rolepay.app -a rolepay-app

app = "rolepay-app"
primary_region = "cdg"
kill_signal = "SIGTERM"
kill_timeout = "20s"
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[env]
  ROLEPAY_NETWORK = "mainnet"
  ROLEPAY_ALLOW_MAINNET = "true"
  ROLEPAY_DEV_SHORTCUTS = "false"
  PUBLIC_URL = "https://app.rolepay.app"
  # Its own passkey domain: passkeys from the demo never work here, and the reverse.
  ROLEPAY_RP_ID = "app.rolepay.app"
  HOST = "0.0.0.0"
  PORT = "8787"
  ROLEPAY_DB_PATH = "/data/rolepay.db"
  ROLEPAY_CLIENT_IP_HEADER = "Fly-Client-IP"
  ROLEPAY_AI_DAILY_CAP = "50"
  # Required before the first deploy: the mainnet stablecoin new communities are paid in.
  # ROLEPAY_PAYOUT_TOKEN = "0x..."

[mounts]
  source = "rolepay_app_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
