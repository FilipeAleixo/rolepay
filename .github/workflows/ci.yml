# Typecheck and the default test suite (no network, no secrets) with coverage on every push and
# pull request. Chain, browser e2e and live AI tests are opt-in and never run here.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Other branches cancel a run a newer push replaces; every commit on main runs to the end, so the
# README's badge reflects a finished run, never a cancelled one.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage (thresholds per package)
        run: pnpm test:coverage

      - name: Coverage summary
        if: always()
        run: node .github/scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
